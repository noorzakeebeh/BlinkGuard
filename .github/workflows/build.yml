name: Build BlinkGuard Desktop Apps

# Builds a standalone desktop executable on Windows, macOS, and Linux.
# Runs on every push to a version tag (e.g. v1.0.0) and uploads the results
# as a draft GitHub Release with all three builds attached.
#
# To trigger a release build:
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allows manually running it from the Actions tab too

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BlinkGuard-Windows
          - os: macos-latest
            artifact_name: BlinkGuard-macOS
          - os: ubuntu-latest
            artifact_name: BlinkGuard-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        working-directory: packaging
        run: pyinstaller blinkguard.spec

      - name: Package artifact (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: |
          mkdir -p out
          cp -r packaging/dist/BlinkGuard out/

      - name: Package artifact (macOS .app)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p out
          cp -r packaging/dist/BlinkGuard.app out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform build
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$name"
          done

      - name: Create GitHub Release with all builds attached
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: "*.zip"
